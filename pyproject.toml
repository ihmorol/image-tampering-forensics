[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tamper-fusion"
version = "0.1.0"
description = "Classical cue fusion for controlled image tampering localization"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "opencv-python-headless>=5.0",
  "Pillow>=10.0",
  "scipy>=1.11",
  "scikit-image>=0.22",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
]

[project.scripts]
tamper-fusion = "tamper_fusion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
